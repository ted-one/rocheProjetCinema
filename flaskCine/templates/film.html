{% extends "base.html" %}
{% block contenu %}
    <div class="container">
        <div class="row"><div class="col-12"><h1>{{ film.titre }}</h1></div></div>
        <div class="row"><div class="col-12"><p>Séance du 21 octobre au 27 octobre</p></div>
        </div>

        <div class="row">
            <div class="col-9">
                <h2>Résumé</h2>
                <p>{{ film.resume }}</p>
                <h2>Séances</h2>
                <ul>
                    <li>{{ seance.heure_date }}, salles, {{ seance.version_langue }}, <p>{% if film.interdit_16_ans %}<img src="{{ url_for('static', filename="assets/interdiction-moins-de-16-ans.png") }}" style="height: 75px;">{% endif %}</p></li>
                </ul>
            </div>
            <div class="col-3"><img src="{{ url_for('static', filename="assets/" ~ film.affiche) }}" class="img-fluid affiche-film" alt=""></div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="row"><div class="col-12"><a href="/seances" class="btn btn-primary">Voir toutes les séances</a></div></div>
        </div>
    </div>
{% endblock %}
