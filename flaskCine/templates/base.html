<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/html">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {% block titre %}Cinéma du Castor{% endblock %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header class="header">
            <img src="{{ url_for('static', filename='assets/banner.png') }}" class="img-fluid img_banner" alt="">
        </header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item dropdown">
                            <a class="nav-link " href="/" role="button" >Accueil</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">Films</a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                {% for film in films %}
                                    <li><a class="dropdown-item" href="/film/{{ film.id }}">{{ film.titre }}</a></li>
                                {% endfor %}
                            </ul>
                        </li>
                        <li class="nav-item ">
                            <a class="nav-link " href="/seances" role="button" >Seances</a>
                        </li>
                    </ul>
                </div>
            </div>
       </nav>
        <main class="container my-4">
            {% block contenu %}
            {% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <footer class="footer">
            <p>Simone de Beauvoir Gragnague BTS 2026 | Teddy ROCHE</p>
        </footer>
    </body>
</html>
