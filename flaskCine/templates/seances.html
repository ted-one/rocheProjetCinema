{% extends "base.html" %}
{% block contenu %}
        <div class="container">
            <div class="row">
                <div class="col-12"><h1>Salle 1</h1></div>
            </div>
            <div id="main" class="container-fluid">
                <div class="container">
                    <div class="row">
                        {% for film in info_seances_films %}
                            <div class="col-4">
                                <div class="seance">
                                    <a href="/film/{{ film.id_film }}">
                                        <img src="{{ url_for('static', filename='assets/' ~ film.affiche) }}" class="img-fluid affiche-film" alt="affiche">
                                    </a>
                                    <div style="padding: 2%;">
                                        <p>Salle {{ film.id_salle }}</p>
                                        <p>{{ film.heure_date }}</p>
                                        <p>{{ film.version_langue }}</p>
                                    </div>
                                </div>

                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="row"><div class="col-12"><a href="/" class="btn btn-primary">Revenir à l'accueil</a></div></div>
        </div>
{% endblock %}
